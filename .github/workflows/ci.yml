name: Validate application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dz_ci
          POSTGRES_DB: dz_ci
          # Disposable CI fixture, never a deployment credential.
          POSTGRES_PASSWORD: ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dz_ci -d dz_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:postgres
        env:
          POSTGRES_TEST_URL: postgresql://dz_ci:ci-fixture-only@127.0.0.1:5432/dz_ci
      - run: npm run build
      - run: node scripts/smoke-postgres.mjs
        env:
          DATABASE_URL: postgresql://dz_ci:ci-fixture-only@127.0.0.1:5432/dz_ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
